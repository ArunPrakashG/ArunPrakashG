</style>
<rect x="40.0" y="23" width="310.0" height="1.5" fill="url(#l)"/>
<circle class="tw" cx="350.0" cy="24" r="2.6" fill="#8b5cf6"/>
<text x="500" y="30" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="17" font-weight="700" letter-spacing="6" fill="url(#tx)">OPEN CHANNEL</text>
<circle class="tw" cx="650.0" cy="24" r="2.6" fill="#22d3ee" style="animation-delay:1.5s"/>
<rect x="654.0" y="23" width="306.0" height="1.5" fill="url(#r)"/>
</svg>
